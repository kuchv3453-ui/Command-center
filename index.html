<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center — CSE 2027 / BPSC Ops</title>

<!-- PWA / installable app support -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0d11">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Command Center">
<style>
:root{
  --bg:#0a0d11;
  --panel:#11161c;
  --panel2:#161c24;
  --line:#232b34;
  --text:#dfe6ec;
  --muted:#8695a3;
  --dim:#5b6772;
  --gold:#d1a544;
  --gold-dim:#8a6f36;
  --teal:#3fa89a;
  --green:#4caf7d;
  --yellow:#e0a838;
  --red:#d9615c;
  --purple:#9b7fd4;
  --mono:ui-monospace,'SF Mono',Consolas,'Roboto Mono',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --radius:3px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
body{padding-bottom:60px;}
::selection{background:var(--gold-dim);color:#fff;}
a{color:var(--gold);}
h1,h2,h3,h4{font-weight:600;margin:0 0 8px;letter-spacing:.2px;}
.mono{font-family:var(--mono);}
.muted{color:var(--muted);}
.dim{color:var(--dim);}
.small{font-size:11px;}
button{font-family:var(--sans);cursor:pointer;}
input,select,textarea{font-family:var(--sans);background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:var(--radius);padding:6px 8px;}
input:focus,select:focus,textarea:focus{outline:1px solid var(--gold);}

/* ===== HEADER / TICKER ===== */
#topbar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#0d1117,#0a0d11 90%);border-bottom:1px solid var(--line);}
#ticker{display:flex;align-items:center;gap:0;overflow-x:auto;padding:10px 14px;gap:22px;}
.tick{display:flex;flex-direction:column;min-width:max-content;}
.tick .v{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--gold);}
.tick .l{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}
.brand{display:flex;align-items:center;gap:10px;padding:10px 14px 0;}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);}
.brand h1{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#f0f3f6;}
.brand .sub{font-size:11px;color:var(--muted);font-family:var(--mono);}

/* ===== NAV ===== */
#nav{display:flex;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);}
#nav button{background:none;border:none;color:var(--muted);padding:11px 14px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;border-bottom:2px solid transparent;}
#nav button.active{color:var(--gold);border-bottom-color:var(--gold);}
#nav button:hover{color:var(--text);}

main{max-width:1180px;margin:0 auto;padding:16px;}
.view{display:none;animation:fade .15s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0}to{opacity:1}}

.grid{display:grid;gap:12px;}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;}
.card h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;}
.stat{font-family:var(--mono);font-size:26px;font-weight:600;color:#f0f3f6;}
.stat.sm{font-size:18px;}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.row + .row{margin-top:6px;}

.bar{height:7px;background:var(--panel2);border-radius:6px;overflow:hidden;border:1px solid var(--line);}
.bar > div{height:100%;background:var(--gold);}
.bar.green>div{background:var(--green);}
.bar.red>div{background:var(--red);}
.bar.teal>div{background:var(--teal);}

.badge{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:10px;font-weight:600;}
.b-green{background:rgba(76,175,125,.15);color:var(--green);border:1px solid rgba(76,175,125,.4);}
.b-yellow{background:rgba(224,168,56,.15);color:var(--yellow);border:1px solid rgba(224,168,56,.4);}
.b-red{background:rgba(217,97,92,.15);color:var(--red);border:1px solid rgba(217,97,92,.4);}
.b-purple{background:rgba(155,127,212,.15);color:var(--purple);border:1px solid rgba(155,127,212,.4);}
.b-teal{background:rgba(63,168,154,.15);color:var(--teal);border:1px solid rgba(63,168,154,.4);}
.b-gold{background:rgba(209,165,68,.15);color:var(--gold);border:1px solid rgba(209,165,68,.4);}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:hover td{background:var(--panel2);}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);}

.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:var(--radius);font-size:12px;}
.btn:hover{border-color:var(--gold);color:var(--gold);}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#1a1408;font-weight:600;}
.btn-gold:hover{opacity:.9;color:#1a1408;}
.btn-red{border-color:var(--red);color:var(--red);}
.btn-sm{padding:3px 8px;font-size:11px;}
.iconbtn{background:none;border:none;color:var(--muted);font-size:14px;padding:2px 6px;}
.iconbtn:hover{color:var(--gold);}

.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px;}
.section-title h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);}
.hairline{height:1px;background:var(--line);margin:14px 0;}

.chip{display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);padding:3px 8px;border-radius:12px;font-size:11px;color:var(--muted);}
.priority-item{border-left:3px solid var(--red);padding:10px 12px;background:var(--panel2);border-radius:var(--radius);margin-bottom:8px;}
.priority-item.p2{border-color:var(--yellow);}
.priority-item.p3{border-color:var(--teal);}
.priority-item.p4{border-color:var(--dim);}

.checklist label{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line);}
.checklist input[type=checkbox]{width:15px;height:15px;accent-color:var(--gold);}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;padding:16px;}
.modal-bg.active{display:flex;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;max-width:480px;width:100%;max-height:88vh;overflow:auto;}
.modal h3{color:var(--gold);font-size:14px;text-transform:uppercase;}
.field{margin-bottom:10px;}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
.field input,.field select,.field textarea{width:100%;}
.field textarea{min-height:60px;resize:vertical;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}

.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);color:var(--text);padding:9px 16px;border-radius:var(--radius);font-size:12.5px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}

.blockrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
.blockrow input[type=number]{width:60px;}
.blockrow input[type=text]{flex:1;}

.chart-bars{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:8px;}
.chart-bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.chart-bars .fill{width:100%;background:var(--gold);border-radius:2px 2px 0 0;min-height:2px;}
.chart-bars .fill.under{background:var(--red);}
.chart-bars .lbl{font-size:9px;color:var(--dim);margin-top:3px;font-family:var(--mono);}

footer{text-align:center;color:var(--dim);font-size:11px;padding:24px 0;font-family:var(--mono);}
@media(max-width:640px){.stat{font-size:21px;}.brand h1{font-size:13px;}}
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">
    <div class="dot" id="statusDot"></div>
    <h1>CSE 2027 Command Center</h1>
    <span class="sub mono" id="phaseLabel">— loading —</span>
  </div>
  <div id="ticker"></div>
</div>

<div id="nav"></div>

<main id="main"></main>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   STATE
========================================================================= */
const START_DATE = '2026-08-13';
const BPSC_DEADLINE = '2026-10-25';
const MAINS_DEADLINE = '2026-10-31';
const FINAL_DEADLINE = '2026-12-31';
const STORAGE_KEY = 'upsc_command_center_v1';

const BPSC_SUBJECTS = [
  {key:'history', name:'History', pages:375},
  {key:'polity', name:'Polity', pages:185},
  {key:'geography', name:'Geography', pages:215},
  {key:'science', name:'Science', pages:215},
  {key:'currentAffairs', name:'Current Affairs', pages:155},
  {key:'biharSpecial', name:'Bihar Special', pages:155},
];
const BPSC_REVISION_CYCLES = 5;   // pages must be revised this many times
const BPSC_PYQ_REVISIONS = 4;     // PYQs must be practiced/revised this many times

const TEST_PAPERS = ['GS Paper I','GS Paper II','GS Paper III','GS Paper IV','Essay','Optional Paper I','Optional Paper II'];

const FINAL_SIMULATOR = [
  {date:'2026-12-26', label:'Essay — Full Simulator'},
  {date:'2026-12-27', label:'GS Paper I + GS Paper II'},
  {date:'2026-12-28', label:'GS Paper III + GS Paper IV'},
  {date:'2026-12-29', label:'Reserve / Recovery / Weak-Area Correction / Test Analysis'},
  {date:'2026-12-30', label:'Optional Paper I + Optional Paper II'},
  {date:'2026-12-31', label:'Complete Performance Analysis'},
];

const DAILY_TARGET_HOURS = 16;
const CRITICAL_HOUR_THRESHOLD = DAILY_TARGET_HOURS - 6; // below this = critical / recovery-needed day
const DEFAULT_BLOCKS = [
  {name:'Optional', hours:3},
  {name:'Decode Civils (GS)', hours:3},
  {name:'Answer Writing', hours:3},
  {name:'BPSC Revision', hours:4},
  {name:'BPSC PYQ Practice', hours:3},
];
/* Short notes and general revision/active-recall happen inside the blocks above —
   they are tracked as completion flags (see shortNotes.log) rather than separate hour blocks. */

/* ===== 2027 MASTER TIMELINE CONSTANTS ===== */
const PRELIMS_FOUNDATION_START = '2026-11-01';
const PRELIMS_FOUNDATION_END = '2026-12-31';
const PRELIMS_TEST_PHASE_START = '2027-01-01';
const PRELIMS_TEST_DEADLINE = '2027-03-31';
const PRELIMS_FINAL_REVISION_START = '2027-04-01';
const PRELIMS_2027_EXAM = '2027-05-23';
const MAINS_TRANSITION_START = '2027-05-25';
const MAINS2027_FLT_START = '2027-06-01';
const MAINS2027_TEST_DEADLINE = '2027-07-31';
const MAINS2027_SIM_START = '2027-08-01';
const MAINS2027_EXAM = '2027-08-20';
const PERSONALITY_START = '2026-08-13';
const PERSONALITY_END = '2027-12-31';
const PERSONALITY_PHASE2_START = '2027-01-01';

const PRELIMS_SUBJECTS = [
  {key:'history', name:'History'},
  {key:'artCulture', name:'Art & Culture'},
  {key:'polity', name:'Polity'},
  {key:'geography', name:'Geography'},
  {key:'economy', name:'Economy'},
  {key:'environment', name:'Environment & Ecology'},
  {key:'scienceTech', name:'Science & Technology'},
  {key:'currentAffairs', name:'Current Affairs'},
  {key:'schemes', name:'Govt. Schemes / Misc.'},
];

const CSAT_AREAS = [
  {key:'readingComprehension', name:'Reading Comprehension'},
  {key:'quantAptitude', name:'Quantitative Aptitude'},
  {key:'basicNumeracy', name:'Basic Numeracy'},
  {key:'dataInterpretation', name:'Data Interpretation'},
  {key:'logicalReasoning', name:'Logical Reasoning'},
  {key:'analyticalAbility', name:'Analytical Ability'},
];

const MAINS2027_PAPERS = ['GS Paper I','GS Paper II','GS Paper III','GS Paper IV','Essay','Optional Paper I','Optional Paper II'];

const SPEAKING_TOPIC_BANK = {
  'Current Affairs': ['A recent government scheme and its impact','A recent Supreme Court judgment','A current international conflict'],
  'UPSC Subjects': ['Federalism in India','Climate change and India\'s response','Right to privacy as a fundamental right'],
  'Bihar': ['Bihar\'s industrial potential','Migration from Bihar — causes and solutions','Bihar\'s education system'],
  'India': ['India as a soft power','Urbanisation challenges in India','India\'s demographic dividend'],
  'International Relations': ['India–China relations','Multilateralism vs bilateralism','India\'s neighbourhood-first policy'],
  'Economy': ['Inflation targeting in India','Gig economy and labour rights','Public vs private sector efficiency'],
  'Governance': ['E-governance and last-mile delivery','Police reforms in India','Judicial pendency and reform'],
  'Society': ['Caste and modern Indian politics','Gender gap in workforce participation','Impact of social media on youth'],
  'Ethics': ['Whistleblowing — right or risk?','Ends vs means in public service','Corruption — systemic or individual failure?'],
  'Personal Opinion': ['A policy you would change and why','A leader you admire and why','A book that shaped your thinking'],
  'Abstract Topics': ['Is technology making us less patient?','Can development and sustainability coexist?','Is competition always healthy?'],
};

function defaultState(){
  const bpscSubjects = {};
  BPSC_SUBJECTS.forEach(s=>{
    bpscSubjects[s.key] = {rev1:0, rev2:0, rev3:0, rev4:0, rev5:0, confidence:2, pyqAccuracy:0, testAccuracy:0, mistakeCount:0, lastRevised:'', nextRevision:''};
  });
  const bpscPyqSubjects = {};
  ['History','Polity','Geography','Science','Current Affairs','Bihar Special','Mixed'].forEach(n=>{
    bpscPyqSubjects[n] = {total: n==='Mixed'?500: Math.round(6000/7), completed:0, correct:0, incorrect:0, revisionCount:0, nextRevision:''};
  });
  const tests = [];
  TEST_PAPERS.forEach(p=>{
    tests.push({id:p+'-S1', paper:p, type:'Sectional 1', scheduled:'', completed:'', score:'', max:'', timeTaken:'', attempted:'', mistakes:'', weakTopics:'', analysisDone:false});
    tests.push({id:p+'-S2', paper:p, type:'Sectional 2', scheduled:'', completed:'', score:'', max:'', timeTaken:'', attempted:'', mistakes:'', weakTopics:'', analysisDone:false});
    tests.push({id:p+'-FLT', paper:p, type:'Full-Length', scheduled:'', completed:'', score:'', max:'', timeTaken:'', attempted:'', mistakes:'', weakTopics:'', analysisDone:false});
  });

  /* ---- Prelims 2027 GS subject trackers ---- */
  const prelimsSubjects = {};
  PRELIMS_SUBJECTS.forEach(s=>{
    prelimsSubjects[s.key] = {sourceCompleted:false, notesUpdated:false, revisions:[false,false,false,false,false], revisionDates:['','','','',''], weakTopics:'', hoursSpent:0, status:'Not Started'};
  });

  /* ---- CSAT areas ---- */
  const csatAreas = {};
  CSAT_AREAS.forEach(a=>{
    csatAreas[a.key] = {hours:0, attempted:0, correct:0, incorrect:0, practiceSessions:0, testsCompleted:0, weakArea:''};
  });

  /* ---- Prelims PYQ subject-level tracker (2013-2026) ---- */
  const prelimsPyqSubjects = {};
  PRELIMS_SUBJECTS.forEach(s=>{
    prelimsPyqSubjects[s.key] = {total: Math.round(5000/PRELIMS_SUBJECTS.length), completed:0, correct:0, incorrect:0, revisionCount:0, lastAttempted:'', nextRevision:''};
  });

  /* ---- Prelims Test Calendar: 30 sectional + 20 FLT, auto-distributed Jan-Mar 2027 ---- */
  const prelimsTests = buildPrelimsTestCalendar();

  /* ---- Mains 2027 FLTs: 7 papers x 3 = 21 ---- */
  const mainsFlts2027 = [];
  MAINS2027_PAPERS.forEach(p=>{
    for(let n=1;n<=3;n++){
      mainsFlts2027.push({
        id:p+'-FLT'+n, paper:p, num:n, scheduled:'', attempted:'', score:'', max:'', timeTaken:'',
        questionsAttempted:'', questionsCompleted:'',
        contentGaps:false, structureIssue:false, examplesIssue:false, currentAffairsIssue:false, presentationIssue:false,
        essay:{introduction:'', argumentQuality:'', examples:'', balance:'', structure:'', conclusion:'', philosophicalDepth:''},
        ethics:{definitions:'', examples:'', caseStudyApproach:'', stakeholderAnalysis:'', ethicalReasoning:''},
        analysis:{wentWell:'', wentWrong:'', contentGap:'', recallFailure:false, structureProblem:false, timeManagement:false, caGap:false, exampleGap:false, questionInterp:false, presentation:false, actionNext:''},
        analysisDone:false, reattempt:false,
      });
    }
  });

  return {
    dashboardVersion: 3,
    decode: {total:145, completed:0, log:{}},
    optional: {total:160, completed:0, log:{}},
    answerWriting: {total:70, completed:0, log:{}},
    shortNotes: {log:{}},
    bpscSubjects,
    bpscPyq: {subjects: bpscPyqSubjects},
    dailyHours: {},
    revisionTopics: [],
    tests,
    mistakes: [],
    weeklyReviews: {},
    blocks: JSON.parse(JSON.stringify(DEFAULT_BLOCKS)),

    prelims2027: {examDate: PRELIMS_2027_EXAM, subjects: prelimsSubjects},
    csat: {areas: csatAreas},
    prelimsPyq: {total:5000, subjects: prelimsPyqSubjects, entries: []},
    prelimsTests: {sectionalTotal:30, fltTotal:20, tests: prelimsTests},
    prelimsRevisionTopics: [],
    mains2027: {examDate: MAINS2027_EXAM, testDeadline: MAINS2027_TEST_DEADLINE, pyqSimulations: []},
    mainsFlts2027,
    personality: {
      dailyActivities: [
        {name:'Read Aloud', minutes:10},
        {name:'English Speaking', minutes:10},
        {name:'Explain a UPSC Topic (no notes)', minutes:10},
        {name:'Current-Affairs Discussion', minutes:10},
        {name:'Vocabulary', minutes:5},
        {name:'Self-Review', minutes:5},
      ],
      dailyLog: {},
      sessions: [],
    },
    interview: {sessions: []},
  };
}

/* Distribute 30 sectional + 20 FLT tests evenly across Jan 1 - Mar 31 2027 */
function buildPrelimsTestCalendar(){
  const list = [];
  const startD = new Date(2027,0,1);
  const spanDays = daysBetweenRaw('2027-01-01','2027-03-31');
  let sCount=0, fCount=0;
  // Build explicit type sequence to guarantee exactly 30 sectional + 20 FLT, interleaved
  const seq = [];
  let sRemain=30, fRemain=20;
  while(sRemain>0 || fRemain>0){
    if(sRemain/ (sRemain+fRemain) > 0.6 && sRemain>0){ seq.push('Sectional'); sRemain--; }
    else if(fRemain>0){ seq.push('Full-Length'); fRemain--; }
    else { seq.push('Sectional'); sRemain--; }
  }
  seq.forEach((type,i)=>{
    const dayOffset = Math.round((i/(seq.length-1)) * spanDays);
    const d = new Date(startD); d.setDate(d.getDate()+dayOffset);
    const dateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(type==='Sectional') sCount++; else fCount++;
    list.push({
      id:'PT-'+(i+1), num:i+1, type, subject:'', scheduled:dateStr, actual:'',
      score:'', max:'', attempted:'', correct:'', incorrect:'', timeTaken:'',
      mistakes:'', weakTopics:'', analysisDone:false, reattempt:false,
    });
  });
  return list;
}
function daysBetweenRaw(a,b){
  const [ay,am,ad]=a.split('-').map(Number), [by,bm,bd]=b.split('-').map(Number);
  return Math.round((new Date(by,bm-1,bd) - new Date(ay,am-1,ad))/86400000);
}

let STATE = load();
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return migrate(parsed);
  }catch(e){ return defaultState(); }
}
/* Extend older saved data with any new modules/fields introduced in later versions,
   without ever discarding existing progress. Shallow keys the user already has (decode,
   bpscSubjects, tests, etc.) are kept as-is; brand-new top-level keys (prelims2027, csat,
   mainsFlts2027, personality, interview, ...) are filled in from defaults if missing. */
function migrate(parsed){
  const def = defaultState();
  const merged = Object.assign({}, def, parsed);
  // Deep-fill any nested objects that may be missing sub-keys (e.g. a subject added later)
  ['prelims2027','csat','prelimsPyq','prelimsTests','mains2027','personality','interview'].forEach(k=>{
    if(!parsed[k]) merged[k] = def[k];
  });
  if(parsed.prelims2027 && parsed.prelims2027.subjects){
    PRELIMS_SUBJECTS.forEach(s=>{ if(!parsed.prelims2027.subjects[s.key]) merged.prelims2027.subjects[s.key] = def.prelims2027.subjects[s.key]; });
  }
  if(parsed.csat && parsed.csat.areas){
    CSAT_AREAS.forEach(a=>{ if(!parsed.csat.areas[a.key]) merged.csat.areas[a.key] = def.csat.areas[a.key]; });
  }
  if(!parsed.mainsFlts2027 || !parsed.mainsFlts2027.length) merged.mainsFlts2027 = def.mainsFlts2027;
  if(!parsed.prelimsRevisionTopics) merged.prelimsRevisionTopics = [];
  // 3-cycle -> 5-cycle BPSC revision upgrade: keep existing rev1-3 progress, add rev4/rev5
  if(parsed.bpscSubjects){
    BPSC_SUBJECTS.forEach(s=>{
      const existing = parsed.bpscSubjects[s.key];
      if(existing){
        if(existing.rev4===undefined) merged.bpscSubjects[s.key].rev4 = 0;
        if(existing.rev5===undefined) merged.bpscSubjects[s.key].rev5 = 0;
      } else {
        merged.bpscSubjects[s.key] = def.bpscSubjects[s.key];
      }
    });
  }
  // BPSC PYQ: add 4x revision-count tracking for users on the older version
  if(parsed.bpscPyq && parsed.bpscPyq.subjects){
    Object.keys(def.bpscPyq.subjects).forEach(name=>{
      const existing = parsed.bpscPyq.subjects[name];
      if(existing){
        if(existing.revisionCount===undefined) merged.bpscPyq.subjects[name].revisionCount = 0;
        if(existing.nextRevision===undefined) merged.bpscPyq.subjects[name].nextRevision = '';
      } else {
        merged.bpscPyq.subjects[name] = def.bpscPyq.subjects[name];
      }
    });
  }
  merged.dashboardVersion = def.dashboardVersion;
  return merged;
}

/* pace engine: remaining / days-remaining-to-deadline */
function paceEngine(total, completed, deadline){
  const remaining = Math.max(total - completed, 0);
  const daysLeft = Math.max(daysBetween(TODAY, deadline), 1);
  const daysUsed = Math.max(daysBetween(START_DATE, TODAY)+1, 1);
  const requiredDaily = remaining>0 ? (remaining/daysLeft) : 0;
  const currentPace = completed / daysUsed;
  const expectedByNow = ((total)/daysBetween(START_DATE,deadline)) * daysUsed;
  const status = completed >= expectedByNow ? 'ahead' : (completed >= expectedByNow*0.9 ? 'ontrack' : 'behind');
  const pctComplete = total>0 ? Math.min(100, (completed/total*100)) : 0;
  return {remaining, daysLeft, requiredDaily, currentPace, status, pctComplete, expectedByNow};
}

/* generic version for modules whose window doesn't start on the original START_DATE */
function paceEngineFrom(total, completed, windowStart, deadline){
  const remaining = Math.max(total - completed, 0);
  const daysLeft = Math.max(daysBetween(TODAY, deadline), 1);
  const daysUsed = Math.max(daysBetween(windowStart, TODAY)+1, 1);
  const requiredDaily = remaining>0 ? (remaining/daysLeft) : 0;
  const currentPace = completed / daysUsed;
  const windowSpan = Math.max(daysBetween(windowStart, deadline),1);
  const expectedByNow = TODAY<windowStart ? 0 : Math.min(total, (total/windowSpan) * daysUsed);
  const status = completed >= expectedByNow ? 'ahead' : (completed >= expectedByNow*0.9 ? 'ontrack' : 'behind');
  const pctComplete = total>0 ? Math.min(100, (completed/total*100)) : 0;
  return {remaining, daysLeft, requiredDaily, currentPace, status, pctComplete, expectedByNow};
}

function statusBadge(status){
  const map = {ahead:'b-green', ontrack:'b-yellow', behind:'b-red'};
  const label = {ahead:'AHEAD', ontrack:'ON TRACK', behind:'BEHIND'};
  return `<span class="badge ${map[status]}">${label[status]}</span>`;
}

function computeDailyScore(dateKey){
  const dh = STATE.dailyHours[dateKey];
  const actualHours = dh ? dh.blocks.reduce((a,b)=>a+(Number(b.actual)||0),0) : 0;
  const hourScore = Math.min(25, (actualHours/DAILY_TARGET_HOURS)*25);
  const mainDone = dh ? dh.blocks.filter(b=>b.done).length : 0;
  const mainTotal = dh ? dh.blocks.length : 1;
  const mainScore = (mainDone/mainTotal)*20;
  const bpscTouched = (STATE.decode.log[dateKey]||0)>0 || Object.values(STATE.bpscSubjects).some(s=>s.lastRevised===dateKey);
  const bpscScore = bpscTouched ? 15 : 0;
  const revisionScore = STATE.revisionTopics.some(t=>t.lastRevised===dateKey) ? 10 : 0;
  const pyqDoneToday = Object.values(STATE.bpscPyq.subjects).reduce((a,s)=>a+((s.logToday===dateKey)?1:0),0)>0;
  const pyqScore = pyqDoneToday ? 10 : (STATE.pyqTodayFlag===dateKey?10:0);
  const awScore = STATE.answerWriting.log[dateKey] ? 10 : 0;
  const snScore = STATE.shortNotes.log[dateKey] ? 5 : 0;
  const mistakeScore = STATE.mistakes.some(m=>m.date===dateKey) ? 5 : 0;
  const total = Math.round(hourScore+mainScore+bpscScore+revisionScore+pyqScore+awScore+snScore+mistakeScore);
  return Math.min(100,total);
}

function computePriorities(){
  const items = [];
  // Mains deadline pressure
  [['Decode Civils',STATE.decode],['Optional',STATE.optional],['Answer Writing',STATE.answerWriting]].forEach(([name,d])=>{
    const p = paceEngine(d.total, d.completed, MAINS_DEADLINE);
    if(p.status==='behind') items.push({level:1, text:`${name} is behind pace — need ${p.requiredDaily.toFixed(1)}/day to finish by 31 Oct.`});
    else if(p.status==='ontrack') items.push({level:3, text:`${name} on track — keep ${p.requiredDaily.toFixed(1)}/day.`});
  });
  // BPSC subjects
  BPSC_SUBJECTS.forEach(s=>{
    const d = STATE.bpscSubjects[s.key];
    const revs = (d.rev1>0?1:0)+(d.rev2>0?1:0)+(d.rev3>0?1:0);
    const status = classifyTopic(revs, d.pyqAccuracy, d.mistakeCount, d.nextRevision);
    if(status==='CRITICAL') items.push({level:1, text:`${s.name} is CRITICAL — low accuracy (${d.pyqAccuracy}%) with repeated mistakes / overdue revision.`});
    else if(status==='WEAK') items.push({level:2, text:`${s.name} is WEAK — revision count ${revs}, PYQ accuracy ${d.pyqAccuracy}%. Prioritise today.`});
  });
  // Revision topics overdue
  STATE.revisionTopics.forEach(t=>{
    if(t.nextRevision && t.nextRevision < TODAY){
      items.push({level:1, text:`Topic "${t.topic}" (${t.subject}) is overdue for revision since ${fmtDate(t.nextRevision)}.`});
    }
  });
  // PYQ pace
  const pyqTotal = Object.values(STATE.bpscPyq.subjects).reduce((a,s)=>a+s.total,0);
  const pyqDone = Object.values(STATE.bpscPyq.subjects).reduce((a,s)=>a+s.completed,0);
  const pp = paceEngine(pyqTotal, pyqDone, BPSC_DEADLINE);
  if(pp.status==='behind') items.push({level:1, text:`Overall BPSC PYQ pace insufficient — need ${pp.requiredDaily.toFixed(0)}/day to hit 6,000 by 25 Oct.`});
  // Unresolved mistakes
  const unresolved = STATE.mistakes.filter(m=>!m.resolved).length;
  if(unresolved>0) items.push({level:2, text:`${unresolved} unresolved mistake${unresolved>1?'s':''} in the mistake log — review before new content.`});
  // Backlog on hours
  const last7 = last7Days().filter(d=>d!==TODAY);
  const shortfallDays = last7.filter(d=>{const s=hoursFor(d); return s<CRITICAL_HOUR_THRESHOLD;}).length;
  if(shortfallDays>=2) items.push({level:2, text:`${shortfallDays} of last 7 days were below 9 focused hours — recovery needed.`});

  // --- 2027 conflict-management: surface the phase-dominant target first ---
  const phase = currentPhase();
  if(phase.n>=3){
    const psub = PRELIMS_SUBJECTS.map(s=>({name:s.name, d:STATE.prelims2027.subjects[s.key]}));
    psub.forEach(({name,d})=>{
      if(d.status==='Not Started' && phase.n===3) items.push({level:2, text:`Prelims 2027: ${name} source not yet started — foundation window closes 31 Dec 2026.`});
    });
  }
  if(phase.n===4){
    const pp2 = STATE.prelimsTests.tests.filter(t=>!t.actual && t.scheduled<TODAY).length;
    if(pp2>0) items.push({level:1, text:`${pp2} Prelims 2027 test${pp2>1?'s are':' is'} OVERDUE (scheduled date passed, not attempted).`});
  }
  if(phase.n===7){
    const overdueFlt = STATE.mainsFlts2027.filter(t=>!t.attempted && t.scheduled && t.scheduled<TODAY).length;
    if(overdueFlt>0) items.push({level:1, text:`${overdueFlt} Mains 2027 FLT${overdueFlt>1?'s':''} overdue against schedule.`});
  }
  // Personality development — parallel daily habit throughout
  const personalityLoggedToday = !!STATE.personality.dailyLog[TODAY];
  if(TODAY>=PERSONALITY_START && TODAY<=PERSONALITY_END && !personalityLoggedToday){
    items.push({level:3, text:'Personality development not logged today — a short daily session keeps this on track.'});
  }

  if(items.length===0) items.push({level:4, text:'No critical gaps detected. Maintain current pace and revision cadence.'});
  return items.sort((a,b)=>a.level-b.level);
}

  STATE.tests.forEach(t=>{ if(t.score!=='' && t.max!=='' && Number(t.max)>0){ (paperGroups[t.paper]=paperGroups[t.paper]||[]).push({...t, pct:Number(t.score)/Number(t.max)*100}); } });
  Object.entries(paperGroups).forEach(([paper,arr])=>{
    if(arr.length>=2){
      const last = arr[arr.length-1], prev = arr[arr.length-2];
      if(last.pct>prev.pct+3) alerts.push({c:'green', t:`Your ${paper} score improved from ${prev.pct.toFixed(0)}% to ${last.pct.toFixed(0)}%.`});

  if(alerts.length===0) alerts.push({c:'green', t:'No alerts right now — steady state. Keep the daily rhythm going.'});
  const order = {red:0, orange:1, yellow:2, green:3, blue:4};
  return alerts.sort((a,b)=>order[a.c]-order[b.c]).slice(0,12);
}
function alertIcon(c){ return {red:'🔴', orange:'🟠', yellow:'🟡', green:'🟢', blue:'🔵'}[c]||'⚪'; }
function classifyTopic(revCount, pyqAcc, mistakes, nextRevision){
  const overdue = nextRevision && nextRevision < TODAY;
  if((pyqAcc>0 && pyqAcc<40 && mistakes>=3) || (overdue && mistakes>=3)) return 'CRITICAL';
  if(revCount<=1 || (pyqAcc>0 && pyqAcc<55)) return 'WEAK';
  if(revCount===2 || (pyqAcc>=55 && pyqAcc<75)) return 'DEVELOPING';
  if(revCount>=3 && pyqAcc>=75) return 'STRONG';
  return 'DEVELOPING';
}
/* Prelims 2027 subject status: Not Started / In Progress / Completed / Needs Revision */
function prelimsSubjectStatus(d){
  const revsDone = d.revisions.filter(Boolean).length;
  if(!d.sourceCompleted && !d.notesUpdated) return 'Not Started';
  if(d.sourceCompleted && d.notesUpdated && revsDone>=1 && revsDone<5) return 'In Progress';
  if(d.sourceCompleted && d.notesUpdated && revsDone>=5) return 'Completed';
  if(d.sourceCompleted && revsDone===0) return 'Needs Revision';
  return 'In Progress';
}
function prelimsStrength(pyqAcc, revsDone, mistakeCount){
  if(pyqAcc>0 && pyqAcc<45 && mistakeCount>=3) return 'CRITICAL';
  if(revsDone<=1 || (pyqAcc>0 && pyqAcc<55)) return 'WEAK';
  if(revsDone<=3 || (pyqAcc>=55 && pyqAcc<75)) return 'MODERATE';
  return 'STRONG';
}
function strengthBadge(status){
  const map = {STRONG:'b-green', MODERATE:'b-yellow', WEAK:'b-red', CRITICAL:'b-purple'};
  return `<span class="badge ${map[status]||'b-gold'}">${status}</span>`;
}

/* Prelims Readiness Score /100, with itemised reasons */
function computeReadinessScore(){
  const subs = PRELIMS_SUBJECTS.map(s=>({key:s.key,name:s.name,d:STATE.prelims2027.subjects[s.key]}));
  const notesCompletion = subs.filter(s=>s.d.notesUpdated).length/subs.length*100;
  const revisionCompletion = subs.reduce((a,s)=>a+s.d.revisions.filter(Boolean).length,0)/(subs.length*5)*100;

  const pyqSubs = Object.values(STATE.prelimsPyq.subjects);
  const pyqTotal = pyqSubs.reduce((a,s)=>a+s.total,0);
  const pyqDone = pyqSubs.reduce((a,s)=>a+s.completed,0);
  const pyqCompletion = pyqTotal? pyqDone/pyqTotal*100 : 0;
  const pyqRevisionCompletion = pyqSubs.reduce((a,s)=>a+Math.min(s.revisionCount,5),0)/(pyqSubs.length*5)*100;

  const sectionalTests = STATE.prelimsTests.tests.filter(t=>t.type==='Sectional' && t.score!=='' && t.max!=='');
  const fltTests = STATE.prelimsTests.tests.filter(t=>t.type==='Full-Length' && t.score!=='' && t.max!=='');
  const sectionalAvg = sectionalTests.length? sectionalTests.reduce((a,t)=>a+Number(t.score)/Number(t.max)*100,0)/sectionalTests.length : 0;
  const fltAvg = fltTests.length? fltTests.reduce((a,t)=>a+Number(t.score)/Number(t.max)*100,0)/fltTests.length : 0;
  const testConsistency = sectionalTests.length+fltTests.length>=5 ? Math.min(100, (sectionalTests.length+fltTests.length)/50*100) : (sectionalTests.length+fltTests.length)/50*100;

  const csatVals = Object.values(STATE.csat.areas);
  const csatAttempted = csatVals.reduce((a,c)=>a+c.attempted,0);
  const csatCorrect = csatVals.reduce((a,c)=>a+c.correct,0);
  const csatAvg = csatAttempted? csatCorrect/csatAttempted*100 : 0;

  const totalMistakes = STATE.mistakes.length + STATE.prelimsPyq.entries.filter(e=>e.mistake).length;
  const resolvedMistakes = STATE.mistakes.filter(m=>m.resolved).length;
  const mistakeReduction = totalMistakes>0 ? resolvedMistakes/totalMistakes*100 : 100;

  const weakSubs = subs.filter(s=>prelimsStrength(STATE.prelimsPyq.subjects[s.key]?.completed>0 ? (STATE.prelimsPyq.subjects[s.key].correct/(STATE.prelimsPyq.subjects[s.key].completed||1)*100):0, s.d.revisions.filter(Boolean).length, s.d.weakTopics?1:0)==='WEAK');
  const weakAreaCorrection = 100 - (weakSubs.length/subs.length*100);

  const score = Math.round(
    notesCompletion*0.15 +
    revisionCompletion*0.15 +
    pyqCompletion*0.12 +
    pyqRevisionCompletion*0.13 +
    sectionalAvg*0.08 +
    fltAvg*0.10 +
    testConsistency*0.07 +
    csatAvg*0.10 +
    mistakeReduction*0.05 +
    weakAreaCorrection*0.05
  );

  let worstSubj=null, worstAcc=101;
  PRELIMS_SUBJECTS.forEach(s=>{
    const ps = STATE.prelimsPyq.subjects[s.key];
    const acc = ps.completed>0 ? (ps.correct/ps.completed*100) : null;
    if(acc!==null && acc<worstAcc){ worstAcc=acc; worstSubj=s.name; }
  });

  return {
    score: Math.max(0,Math.min(100,score)),
    notesCompletion, revisionCompletion, pyqCompletion, pyqRevisionCompletion,
    sectionalAvg, fltAvg, csatAvg, mistakeReduction,
    worstSubj, worstAcc,
    fltCompleted: fltTests.length, sectionalCompleted: sectionalTests.length,
  };
}
function readinessLabel(score){
  if(score>=90) return {t:'Exam Ready', c:'b-green'};
  if(score>=75) return {t:'Strong but Needs Polishing', c:'b-teal'};
  if(score>=60) return {t:'Risk Zone', c:'b-yellow'};
  return {t:'Not Ready', c:'b-red'};
}

function topicBadge(status){
  const map = {STRONG:'b-green', DEVELOPING:'b-yellow', WEAK:'b-red', CRITICAL:'b-purple'};
  return `<span class="badge ${map[status]}">${status}</span>`;
}
function hoursFor(dateKey){
  const dh = STATE.dailyHours[dateKey];
  if(!dh) return 0;
  return dh.blocks.reduce((a,b)=>a+(Number(b.actual)||0),0);
}
function last7Days(){
  const arr=[];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    arr.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
  }
  return arr;
}
function lastNDays(n){
  const arr=[];
  for(let i=n-1;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    arr.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
  }
  return arr;
}

function weakestTopic(){

function mostOverdueRevision(){

}

function expectedCompletion(total, completed, currentPace){
  if(completed>=total) return 'Complete';
  if(currentPace<=0) return 'No pace data yet';
  const daysNeeded = Math.ceil((total-completed)/currentPace);
  const d = new Date(); d.setDate(d.getDate()+daysNeeded);
  return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
}

/* =========================================================================
   VIEW: ANALYTICS
========================================================================= */
function viewAnalytics(){
  const mainsTotal = STATE.decode.total+STATE.optional.total+STATE.answerWriting.total;
  const mainsDone = STATE.decode.completed+STATE.optional.completed+STATE.answerWriting.completed;
  const bpscTotalPages = BPSC_SUBJECTS.reduce((a,s)=>a+s.pages,0)*3;
  const bpscDone = BPSC_SUBJECTS.reduce((a,s)=>{const d=STATE.bpscSubjects[s.key];return a+d.rev1+d.rev2+d.rev3+d.rev4+d.rev5;},0);
  const overallPct = ((mainsDone/mainsTotal*0.5)+(bpscDone/bpscTotalPages*0.5))*100;

  // revision distribution
  const distribution = {0:0,1:0,2:0,3:0,'4+':0};
  STATE.revisionTopics.forEach(t=>{
    if(t.revCount<=0) distribution[0]++;
    else if(t.revCount===1) distribution[1]++;
    else if(t.revCount===2) distribution[2]++;
    else if(t.revCount===3) distribution[3]++;
    else distribution['4+']++;
  });
  const maxDist = Math.max(1,...Object.values(distribution));

  // strong/weak subjects by pyq accuracy
  const subjRanked = BPSC_SUBJECTS.map(s=>({name:s.name, acc:STATE.bpscSubjects[s.key].pyqAccuracy})).sort((a,b)=>b.acc-a.acc);
  const strong = subjRanked.filter(s=>s.acc>=70).map(s=>s.name);
  const weak = subjRanked.filter(s=>s.acc>0 && s.acc<50).map(s=>s.name);
  const critical = STATE.revisionTopics.filter(t=>classifyTopic(t.revCount,t.pyqAcc,t.mistakes,t.nextRevision)==='CRITICAL').map(t=>t.topic);

  // study hour chart last 14 days
  const days = lastNDays(14);
  const hoursBars = days.map(d=>{
    const h = hoursFor(d);
    const pct = Math.min(100, h/DAILY_TARGET_HOURS*100);
    return `<div class="col"><div class="fill ${h<CRITICAL_HOUR_THRESHOLD?'under':''}" style="height:${pct}%"></div><div class="lbl">${d.slice(8)}</div></div>`;
  }).join('');
  const avgHours = (days.reduce((a,d)=>a+hoursFor(d),0)/days.length).toFixed(1);
  const daysAtTarget = days.filter(d=>hoursFor(d)>=DAILY_TARGET_HOURS).length;
  const daysBelow = days.filter(d=>hoursFor(d)<CRITICAL_HOUR_THRESHOLD).length;

  // test analytics
  const scored = STATE.tests.filter(t=>t.score!=='' && t.max!=='' && Number(t.max)>0).map(t=>Number(t.score)/Number(t.max)*100);
  const avgScore = scored.length? (scored.reduce((a,b)=>a+b,0)/scored.length).toFixed(1) : '—';
  const highScore = scored.length? Math.max(...scored).toFixed(1):'—';
  const lowScore = scored.length? Math.min(...scored).toFixed(1):'—';

  return `
  <div class="section-title"><h2>Overall</h2></div>
  <div class="grid g4">
    <div class="card"><h3>Overall Completion</h3><div class="stat">${overallPct.toFixed(1)}%</div></div>
    <div class="card"><h3>Mains Completion</h3><div class="stat">${(mainsDone/mainsTotal*100).toFixed(1)}%</div></div>
    <div class="card"><h3>BPSC Completion</h3><div class="stat">${(bpscDone/bpscTotalPages*100).toFixed(1)}%</div></div>
    <div class="card"><h3>Avg Hours (14d)</h3><div class="stat">${avgHours}</div></div>
  </div>

  <div class="section-title"><h2>Study-Hour Analytics — Last 14 Days</h2><span class="small dim">${daysAtTarget} days ≥${DAILY_TARGET_HOURS}h · ${daysBelow} days &lt;${CRITICAL_HOUR_THRESHOLD}h</span></div>
  <div class="card"><div class="chart-bars">${hoursBars}</div></div>

  <div class="grid g2" style="margin-top:14px;">
    <div class="card">
      <h3>Revision Distribution</h3>
      ${Object.entries(distribution).map(([k,v])=>`
        <div class="row small"><span class="muted">Revised ${k} time${k==1?'':'s'}</span><span>${v}</span></div>
        <div class="bar"><div style="width:${v/maxDist*100}%"></div></div>
      `).join('')}
    </div>
    <div class="card">
      <h3>Test Analytics</h3>
      <div class="row"><span class="muted">Average Score</span><b>${avgScore}${avgScore!=='—'?'%':''}</b></div>
      <div class="row"><span class="muted">Highest Score</span><b>${highScore}${highScore!=='—'?'%':''}</b></div>
      <div class="row"><span class="muted">Lowest Score</span><b>${lowScore}${lowScore!=='—'?'%':''}</b></div>
      <div class="row"><span class="muted">Tests Recorded</span><b>${scored.length} / 21</b></div>
    </div>
  </div>

  <div class="grid g3" style="margin-top:14px;">
    <div class="card"><h3>Strong Areas</h3>${strong.length?strong.map(s=>`<span class="chip" style="margin:2px;color:var(--green);border-color:var(--green)">${s}</span>`).join(''):'<span class="dim small">None yet</span>'}</div>
    <div class="card"><h3>Weak Areas</h3>${weak.length?weak.map(s=>`<span class="chip" style="margin:2px;color:var(--red);border-color:var(--red)">${s}</span>`).join(''):'<span class="dim small">None yet</span>'}</div>
    <div class="card"><h3>Critical Topics</h3>${critical.length?critical.map(s=>`<span class="chip" style="margin:2px;color:var(--purple);border-color:var(--purple)">${s}</span>`).join(''):'<span class="dim small">None yet</span>'}</div>
  </div>
  `;
}

function viewPriority(){
  const items = computePriorities();
  const levels = {1:'PRIORITY 1 — Critical',2:'PRIORITY 2 — High',3:'PRIORITY 3 — Important',4:'PRIORITY 4 — Maintenance'};
  let html = `<div class="section-title"><h2>What Should I Study Now?</h2></div>`;
  [1,2,3,4].forEach(lvl=>{
    const list = items.filter(i=>i.level===lvl);
    if(list.length===0) return;
    html += `<h4 class="small" style="color:var(--gold);text-transform:uppercase;letter-spacing:.06em;margin-top:16px;">${levels[lvl]}</h4>`;
    html += list.map(i=>`<div class="priority-item p${lvl}">${i.text}</div>`).join('');
  });
  return html;
}

function weekKey(d){
  const dt = parseISO(d);
  const day = dt.getDay();
  const monday = new Date(dt); monday.setDate(dt.getDate()-((day+6)%7));
  return monday.toISOString().slice(0,10);
}
function viewPlanner(){
  const wk = weekKey(TODAY);

function addDaysISO(dateStr, n){
  const d = parseISO(dateStr); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

      <td><button class="iconbtn" data-act="mflt-analyse" data-i="${i}">✎ Analyse</button></td>
    </tr>`;
  }).join('');

  const recurring = detectRecurringFltIssues();

  return `
  <div class="section-title"><h2>Mains 2027 FLTs — 7 Papers × 3 = 21</h2><span class="small dim">1 Jun – 31 Jul 2027</span></div>
  ${recurring ? `<div class="card" style="border-color:var(--red);margin-bottom:12px;">🔴 ${recurring}</div>` : ''}

  <table>
    <thead><tr><th>Paper</th><th>Scheduled</th><th>Attempted</th><th>Score</th><th>Max</th><th>%</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
  </div>
  `;
}
function detectRecurringFltIssues(){
  const flags = ['recallFailure','structureProblem','timeManagement','caGap','exampleGap','questionInterp','presentation'];
  const labels = {recallFailure:'recall failure', structureProblem:'structure problems', timeManagement:'time-management problems', caGap:'current-affairs gaps', exampleGap:'example/value-addition gaps', questionInterp:'question-interpretation problems', presentation:'presentation problems'};
  const recent = STATE.mainsFlts2027.filter(t=>t.attempted).slice(-6);
  if(recent.length<3) return null;
  let worst=null, worstCount=0;
  flags.forEach(f=>{
    const count = recent.filter(t=>t.analysis[f]).length;
    if(count>worstCount){ worstCount=count; worst=f; }
  });
  if(worst && worstCount>=Math.ceil(recent.length*0.5)){
    return `You have reported ${labels[worst]} in ${worstCount} of your last ${recent.length} Mains tests. This is now a high-priority weakness.`;
  }
  return null;
}

/* =========================================================================
   EVENT HANDLERS
========================================================================= */
function escAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

function openModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalBg').classList.add('active');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('active'); }
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });

function attachHandlers(){
  const main = document.getElementById('main');

  main.querySelectorAll('[data-act]').forEach(el=>{
    const act = el.dataset.act;

    if(act==='unit-plus' || act==='unit-minus'){
      el.onclick = ()=>{
        const key = el.dataset.key;
        const delta = act==='unit-plus'?1:-1;
        STATE[key].completed = Math.max(0, Math.min(STATE[key].total, STATE[key].completed+delta));
        STATE[key].log[TODAY] = (STATE[key].log[TODAY]||0)+delta;
        save(); renderAll(); toast('Updated '+key);
      };
    }
    if(act==='block-name') el.onchange=()=>{ ensureToday().blocks[el.dataset.i].name = el.value; save(); };
    if(act==='block-planned') el.onchange=()=>{ ensureToday().blocks[el.dataset.i].hours = Number(el.value)||0; save(); renderTicker(); };
    if(act==='block-actual') el.onchange=()=>{ ensureToday().blocks[el.dataset.i].actual = Number(el.value)||0; save(); renderAll(); };
    if(act==='block-done') el.onchange=()=>{ ensureToday().blocks[el.dataset.i].done = el.checked; save(); renderTicker(); };
    if(act==='reset-blocks') el.onclick=()=>{ ensureToday().blocks = STATE.blocks.map(b=>({name:b.name,hours:b.hours,actual:0,done:false})); save(); renderAll(); };

    if(act==='toggle-shortnotes') el.onchange=()=>{ if(el.checked) STATE.shortNotes.log[TODAY]=true; else delete STATE.shortNotes.log[TODAY]; save(); renderAll(); };
    if(act==='toggle-aw') el.onchange=()=>{ if(el.checked) STATE.answerWriting.log[TODAY]=true; else delete STATE.answerWriting.log[TODAY]; save(); renderAll(); };
    if(act==='toggle-pyqflag') el.onchange=()=>{ STATE.pyqTodayFlag = el.checked ? TODAY : null; save(); renderAll(); };
    if(act==='today-notes') el.onchange=()=>{ ensureToday().notes = el.value; save(); };

    if(act==='bpsc-rev') el.onchange=()=>{
      const s = BPSC_SUBJECTS.find(s=>s.key===el.dataset.key);
      STATE.bpscSubjects[el.dataset.key][el.dataset.rev] = Math.max(0, Math.min(s.pages, Number(el.value)||0));
      STATE.bpscSubjects[el.dataset.key].lastRevised = TODAY;
      save(); renderAll();
    };
    if(act==='bpsc-field') el.onchange=()=>{
      const f = el.dataset.f;
      STATE.bpscSubjects[el.dataset.key][f] = (f==='nextRevision') ? el.value : Number(el.value)||0;
      save(); renderAll();
    };

    if(act==='pyq-field') el.onchange=()=>{
      const f = el.dataset.f;
      STATE.bpscPyq.subjects[el.dataset.s][f] = (f==='nextRevision') ? el.value : Number(el.value)||0;
      save(); renderAll();
    };

    if(act==='rev-add') el.onclick = ()=> openTopicModal(null);
    if(act==='rev-edit') el.onclick = ()=> openTopicModal(Number(el.dataset.i));
    if(act==='rev-del') el.onclick = ()=>{ if(confirm('Delete this topic?')){ STATE.revisionTopics.splice(el.dataset.i,1); save(); renderAll(); } };
    if(act==='rev-inc') el.onclick = ()=>{
      const t = STATE.revisionTopics[el.dataset.i];
      t.revCount = (t.revCount||0)+1; t.lastRevised = TODAY;
      const next = new Date(); next.setDate(next.getDate()+7);
      t.nextRevision = next.toISOString().slice(0,10);
      save(); renderAll(); toast('Marked revised');
    };

    if(act==='test-field') el.onchange=()=>{ STATE.tests[el.dataset.i][el.dataset.f] = el.value; save(); renderAll(); };
    if(act==='test-analysis') el.onchange=()=>{ STATE.tests[el.dataset.i].analysisDone = el.checked; save(); };

    if(act==='mistake-add') el.onclick = ()=> openMistakeModal();
    if(act==='mistake-resolve') el.onclick = ()=>{ STATE.mistakes[el.dataset.i].resolved = !STATE.mistakes[el.dataset.i].resolved; save(); renderAll(); };
    if(act==='mistake-del') el.onclick = ()=>{ if(confirm('Delete this mistake entry?')){ STATE.mistakes.splice(el.dataset.i,1); save(); renderAll(); } };

    if(act==='wr-field') el.onchange=()=>{ STATE.weeklyReviews[weekKey(TODAY)][el.dataset.f] = el.value; save(); };

    /* ---- Prelims 2027 GS ---- */
    if(act==='prelims-field') el.onchange=()=>{
      const f = el.dataset.f, key = el.dataset.key;
      const v = el.dataset.type==='bool' ? el.checked : (el.dataset.type==='num' ? Number(el.value)||0 : el.value);
      STATE.prelims2027.subjects[key][f] = v;
      save(); renderAll();
    };
    if(act==='prelims-rev') el.onchange=()=>{
      const key = el.dataset.key, idx = Number(el.dataset.idx);
      STATE.prelims2027.subjects[key].revisions[idx] = el.checked;
      STATE.prelims2027.subjects[key].revisionDates[idx] = el.checked ? TODAY : '';
      save(); renderAll();
    };

    /* ---- CSAT ---- */
    if(act==='csat-field') el.onchange=()=>{
      const f = el.dataset.f, key = el.dataset.key;
      STATE.csat.areas[key][f] = (f==='weakArea') ? el.value : Number(el.value)||0;
      save(); renderAll();
    };

    /* ---- Prelims PYQs ---- */
    if(act==='ppyq-field') el.onchange=()=>{
      const f = el.dataset.f, key = el.dataset.key;
      STATE.prelimsPyq.subjects[key][f] = (f==='nextRevision') ? el.value : Number(el.value)||0;
      save(); renderAll();
    };
    if(act==='ppyq-total') el.onchange=()=>{ STATE.prelimsPyq.total = Number(el.value)||0; save(); renderAll(); };
    if(act==='ppyq-entry-add') el.onclick = ()=> openPrelimsPyqEntryModal();
    if(act==='ppyq-entry-del') el.onclick = ()=>{ if(confirm('Delete this PYQ entry?')){ STATE.prelimsPyq.entries.splice(el.dataset.i,1); save(); renderAll(); } };

    /* ---- Prelims Tests ---- */
    if(act==='ptest-field') el.onchange=()=>{ STATE.prelimsTests.tests[el.dataset.i][el.dataset.f] = el.value; save(); renderAll(); };
    if(act==='ptest-analysis') el.onchange=()=>{ STATE.prelimsTests.tests[el.dataset.i].analysisDone = el.checked; save(); };

    /* ---- Mains 2027 PYQ simulator ---- */
    if(act==='sim-add') el.onclick = ()=> openSimModal();
    if(act==='sim-del') el.onclick = ()=>{ if(confirm('Delete this simulation entry?')){ STATE.mains2027.pyqSimulations.splice(el.dataset.i,1); save(); renderAll(); } };

    /* ---- Mains 2027 FLTs ---- */
    if(act==='mflt-field') el.onchange=()=>{ STATE.mainsFlts2027[el.dataset.i][el.dataset.f] = el.value; save(); renderAll(); };
    if(act==='mflt-analyse') el.onclick = ()=> openFltAnalysisModal(Number(el.dataset.i));

    /* ---- Personality development ---- */
    if(act==='pers-daily-toggle') el.onchange=()=>{
      if(!STATE.personality.dailyLog[TODAY]) STATE.personality.dailyLog[TODAY] = {};
      STATE.personality.dailyLog[TODAY][el.dataset.i] = el.checked;
      save(); renderAll();
    };
    if(act==='pers-activity-name') el.onchange=()=>{ STATE.personality.dailyActivities[el.dataset.i].name = el.value; save(); };
    if(act==='pers-activity-min') el.onchange=()=>{ STATE.personality.dailyActivities[el.dataset.i].minutes = Number(el.value)||0; save(); renderAll(); };
    if(act==='gen-topic') el.onclick = ()=>{
      const cat = document.getElementById('topicCategorySel').value;
      const list = SPEAKING_TOPIC_BANK[cat] || [];
      const topic = list[Math.floor(Math.random()*list.length)] || 'Free topic of your choice';
      document.getElementById('generatedTopic').textContent = topic;
      document.getElementById('generatedTopic').dataset.topic = topic;
    };
    if(act==='log-speaking-session') el.onclick = ()=>{
      const topicEl = document.getElementById('generatedTopic');
      openSpeakingSessionModal(topicEl?.dataset.topic || '');
    };
    if(act==='pers-del') el.onclick = ()=>{ if(confirm('Delete this session?')){ STATE.personality.sessions.splice(el.dataset.i,1); save(); renderAll(); } };

    /* ---- Interview / discussion ---- */
    if(act==='interview-add') el.onclick = ()=> openInterviewModal();
    if(act==='interview-del') el.onclick = ()=>{ if(confirm('Delete this session?')){ STATE.interview.sessions.splice(el.dataset.i,1); save(); renderAll(); } };

    if(act==='export-data') el.onclick = exportData;
    if(act==='reset-data') el.onclick = ()=>{ if(confirm('This will permanently delete ALL dashboard data. Type OK to confirm by pressing OK below.')){ if(confirm('Are you absolutely sure? This cannot be undone.')){ localStorage.removeItem(STORAGE_KEY); STATE = defaultState(); save(); renderAll(); toast('All data reset'); } } };
  });

  const importFile = document.getElementById('importFile');
  if(importFile){
    importFile.onchange = (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        try{
          const data = JSON.parse(ev.target.result);
          STATE = Object.assign(defaultState(), data);
          save(); renderAll(); toast('Backup imported');
        }catch(err){ alert('Invalid backup file.'); }
      };
      reader.readAsText(file);
    };
  }
}

function exportData(){
  const blob = new Blob([JSON.stringify(STATE,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `command-center-backup-${TODAY}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Backup exported');
}

function openTopicModal(idx){
  const editing = idx!==null;
  const t = editing ? STATE.revisionTopics[idx] : {topic:'',subject:BPSC_SUBJECTS[0].name,revCount:0,lastRevised:'',nextRevision:'',pyqAcc:0,testAcc:0,mistakes:0,confidence:2};
  openModal(`
    <h3>${editing?'Edit':'Add'} Revision Topic</h3>
    <div class="field"><label>Topic</label><input type="text" id="m-topic" value="${escAttr(t.topic)}"></div>
    <div class="field"><label>Subject</label><input type="text" id="m-subject" value="${escAttr(t.subject)}" list="subj-list">
      <datalist id="subj-list">${BPSC_SUBJECTS.map(s=>`<option value="${s.name}">`).join('')}</datalist>
    </div>
    <div class="field"><label>Revision Count</label><input type="number" id="m-revcount" value="${t.revCount}" min="0"></div>
    <div class="field"><label>Last Revised</label><input type="date" id="m-last" value="${t.lastRevised}"></div>
    <div class="field"><label>Next Revision</label><input type="date" id="m-next" value="${t.nextRevision}"></div>
    <div class="field"><label>PYQ Accuracy (%)</label><input type="number" id="m-pyqacc" value="${t.pyqAcc}" min="0" max="100"></div>
    <div class="field"><label>Test Accuracy (%)</label><input type="number" id="m-testacc" value="${t.testAcc}" min="0" max="100"></div>
    <div class="field"><label>Mistake Count</label><input type="number" id="m-mistakes" value="${t.mistakes}" min="0"></div>
    <div class="field"><label>Confidence (1–5)</label><input type="number" id="m-conf" value="${t.confidence}" min="1" max="5"></div>
    <div class="modal-actions">
      <button class="btn" data-act="close-modal">Cancel</button>
      <button class="btn btn-gold" id="m-save">Save</button>
    </div>
  `);
  document.getElementById('m-save').onclick = ()=>{
    const newT = {
      topic: document.getElementById('m-topic').value.trim() || 'Untitled Topic',
      subject: document.getElementById('m-subject').value.trim(),
      revCount: Number(document.getElementById('m-revcount').value)||0,
      lastRevised: document.getElementById('m-last').value,
      nextRevision: document.getElementById('m-next').value,
      pyqAcc: Number(document.getElementById('m-pyqacc').value)||0,
      testAcc: Number(document.getElementById('m-testacc').value)||0,
      mistakes: Number(document.getElementById('m-mistakes').value)||0,
      confidence: Number(document.getElementById('m-conf').value)||1,
    };
    if(editing) STATE.revisionTopics[idx] = newT; else STATE.revisionTopics.push(newT);
    save(); closeModal(); renderAll(); toast('Topic saved');
  };
  main_bindClose();
}
function openMistakeModal(){
  openModal(`
    <h3>Log Mistake</h3>
    <div class="field"><label>Date</label><input type="date" id="m-date" value="${TODAY}"></div>
    <div class="field"><label>Subject</label><input type="text" id="m-subject"></div>
    <div class="field"><label>Topic</label><input type="text" id="m-topic"></div>
    <div class="field"><label>Question</label><textarea id="m-question"></textarea></div>
    <div class="field"><label>Mistake Type</label><select id="m-type">${MISTAKE_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
    <div class="field"><label>Why I got it wrong</label><textarea id="m-why"></textarea></div>
    <div class="field"><label>Correct concept / approach</label><textarea id="m-concept"></textarea></div>
    <div class="field"><label>Revision required?</label><select id="m-revreq"><option value="yes">Yes</option><option value="no">No</option></select></div>
    <div class="modal-actions">
      <button class="btn" data-act="close-modal">Cancel</button>
      <button class="btn btn-gold" id="m-save">Save</button>
    </div>
  `);
  document.getElementById('m-save').onclick = ()=>{
    STATE.mistakes.push({
      date: document.getElementById('m-date').value || TODAY,
      subject: document.getElementById('m-subject').value.trim() || '—',
      topic: document.getElementById('m-topic').value.trim() || '—',
      question: document.getElementById('m-question').value.trim(),
      type: document.getElementById('m-type').value,
      why: document.getElementById('m-why').value.trim(),
      concept: document.getElementById('m-concept').value.trim(),
      revisionRequired: document.getElementById('m-revreq').value==='yes',
      revisionCount: 0,
      resolved: false,
    });
    save(); closeModal(); renderAll(); toast('Mistake logged');
  };
  main_bindClose();
}
function main_bindClose(){
  document.querySelectorAll('[data-act="close-modal"]').forEach(b=>b.onclick=closeModal);
}

function openFltAnalysisModal(i){
  const t = STATE.mainsFlts2027[i];
  const isEssay = t.paper==='Essay';
  const isEthics = t.paper==='GS Paper IV';
  openModal(`
    <h3>Analyse — ${t.paper} #${t.num}</h3>
    <div class="field"><label>What went well?</label><textarea id="f-well">${t.analysis.wentWell}</textarea></div>
    <div class="field"><label>What went wrong?</label><textarea id="f-wrong">${t.analysis.wentWrong}</textarea></div>
    <div class="field"><label>Content gap</label><textarea id="f-gap">${t.analysis.contentGap}</textarea></div>
    <div class="field"><label>Action for next test</label><textarea id="f-action">${t.analysis.actionNext}</textarea></div>
    <div class="field"><label>Flag recurring problems</label>
      <label class="row small"><span>Recall failure</span><input type="checkbox" id="f-recall" ${t.analysis.recallFailure?'checked':''}></label>
      <label class="row small"><span>Structure problem</span><input type="checkbox" id="f-structure" ${t.analysis.structureProblem?'checked':''}></label>
      <label class="row small"><span>Time-management problem</span><input type="checkbox" id="f-time" ${t.analysis.timeManagement?'checked':''}></label>
      <label class="row small"><span>Current-affairs gap</span><input type="checkbox" id="f-ca" ${t.analysis.caGap?'checked':''}></label>
      <label class="row small"><span>Example/value-addition gap</span><input type="checkbox" id="f-example" ${t.analysis.exampleGap?'checked':''}></label>
      <label class="row small"><span>Question-interpretation problem</span><input type="checkbox" id="f-interp" ${t.analysis.questionInterp?'checked':''}></label>
      <label class="row small"><span>Presentation problem</span><input type="checkbox" id="f-present" ${t.analysis.presentation?'checked':''}></label>
    </div>
    ${isEssay?`<div class="field"><label>Essay-specific notes (intro / argument / examples / balance / structure / conclusion / depth)</label><textarea id="f-essay">${t.essay.introduction}</textarea></div>`:''}
    ${isEthics?`<div class="field"><label>Ethics-specific notes (definitions / examples / case-study / stakeholders / reasoning)</label><textarea id="f-ethics">${t.ethics.definitions}</textarea></div>`:''}
    <div class="modal-actions">
      <button class="btn" data-act="close-modal">Cancel</button>
      <button class="btn btn-gold" id="m-save">Save Analysis</button>
    </div>
  `);
  document.getElementById('m-save').onclick = ()=>{
    Object.assign(t.analysis, {
      wentWell: document.getElementById('f-well').value.trim(),
      wentWrong: document.getElementById('f-wrong').value.trim(),
      contentGap: document.getElementById('f-gap').value.trim(),
      actionNext: document.getElementById('f-action').value.trim(),
      recallFailure: document.getElementById('f-recall').checked,
      structureProblem: document.getElementById('f-structure').checked,
      timeManagement: document.getElementById('f-time').checked,
      caGap: document.getElementById('f-ca').checked,
      exampleGap: document.getElementById('f-example').checked,
      questionInterp: document.getElementById('f-interp').checked,
      presentation: document.getElementById('f-present').checked,
    });
    if(isEssay) t.essay.introduction = document.getElementById('f-essay').value.trim();
    if(isEthics) t.ethics.definitions = document.getElementById('f-ethics').value.trim();
    t.analysisDone = true;
    save(); closeModal(); renderAll(); toast('Analysis saved');
  };
  main_bindClose();
}

   INIT
========================================================================= */
ensureToday();
save();
renderAll();

/* Register service worker for offline + installable app support.
   Silently does nothing if opened as a local file:// (no server) —
   the dashboard itself still works exactly the same either way. */
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
